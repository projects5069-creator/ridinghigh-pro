name: OHLC Backfill

on:
  schedule:
    - cron: '45 21 * * 1-5'   # 16:45 Peru (UTC-5), Mon-Fri — runs AFTER post_analysis collector (16:05) finishes; decoupled per TASK-190
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    # TASK-239 palliative 2: raised 2026-07-30 as headroom, not because the data
    # demanded it. Measured on 2026-07-30: last ten runs span 8m53s to 18m22s and
    # the last two went 18m22s down to 15m28s, so this job had about 38 percent
    # headroom under the old 25 min ceiling. Raised anyway because it reads the
    # same July rows as the collector through recent_months 2, and each phantom
    # symbol there blocks the provider call for roughly 18s. If the collector
    # trend reaches this job the ceiling is already in place.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install finvizfinance gspread google-auth google-api-python-client pandas yfinance pytz pandas_market_calendars ta alpaca-py

      - name: Backfill missing OHLC (cross-month, decoupled from collector — TASK-190)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DATA_PROVIDER: alpaca
          ALPACA_PAPER: "true"
        run: |
          # TASK-124: v2 cross-month (current + previous) heals end-of-month
          # rows that v1 (active-month, D1-only trigger) left PENDING forever.
          # TASK-190: moved here from post_analysis.yml so a slow/timed-out
          # backfill no longer cancels the collector (own 25m budget).
          python backfill_ohlc_v2.py --recent 2 --apply

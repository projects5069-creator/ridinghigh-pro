name: Post Analysis Collector

on:
  schedule:
    - cron: '5 21 * * 1-5'   # 16:05 Peru (UTC-5), Mon-Fri — offset from hour boundary to avoid GH Actions cron drift
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    # TASK-239 palliative 2: raised 2026-07-30. Collector went 23m25s on 28/7 to
    # 26m23s on 29/7, about 3 min per day, against a 30 min ceiling, so the run
    # after next was projected at 32m and would have been cancelled. Each phantom
    # symbol blocks yf.Ticker().info for roughly 18s and there are 35 of them in
    # July, so about 10 min per run is pure waste. Marking those rows (TASK-246)
    # is the real reduction. Incremental save is still missing:
    # post_analysis_collector.py:638 saves one batch at the end, so a cancelled
    # run loses everything.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install finvizfinance gspread google-auth google-api-python-client pandas yfinance pytz pandas_market_calendars ta alpaca-py

      - name: EOD Snapshot (portfolio + daily_summary)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DATA_PROVIDER: alpaca
          ALPACA_PAPER: "true"
        run: |
          python auto_scanner.py --eod

      - name: Run Post Analysis Collector
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DATA_PROVIDER: alpaca
          ALPACA_PAPER: "true"
        run: |
          python post_analysis_collector.py

      - name: Enrich with Intraday Data
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DATA_PROVIDER: alpaca
          ALPACA_PAPER: "true"
        run: |
          python enrich_post_analysis.py

      # TASK-190: OHLC backfill moved to its own workflow (backfill_ohlc.yml).
      # It was the last step and routinely crossed this job's 15min timeout
      # as monthly rows accumulated, cancelling the whole collect job.
      # Decoupling keeps the collector fast/reliable; backfill runs after.
